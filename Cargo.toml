[package]
authors = ["Corentin Henry <corentinhenry@gmail.com>"]
name = "netlink-sys"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
keywords = ["netlink", "ip", "linux"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rust-netlink/netlink-sys"
description = "netlink sockets, with optional integration with tokio"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
libc = "0.2.164"
log = "0.4.8"

[dependencies.tokio]
optional = true
version = "1.54"
default-features = false
# We only depend on tokio for AsyncFd
features = ["net"]

[dependencies.mio]
optional = true
version = "1.0"
features = ["os-poll", "os-ext"]

[dependencies.async-io]
optional = true
version = "2"

[features]
default = []
mio_socket = ["mio"]
tokio_socket = ["tokio"]
smol_socket = ["async-io"]

[dev-dependencies]
netlink-packet-audit = "0.7.0"
netlink-packet-core = "0.9.0"

[dev-dependencies.tokio]
version = "1.54"
default-features = false
# We only depend on tokio for AsyncFd
features = ["net", "macros", "rt-multi-thread"]

[dev-dependencies.async-std]
version = "1.13"
features = ["attributes"]


[[example]]
name = "audit_events"

[[example]]
name = "audit_events_tokio"
required-features = ["tokio_socket"]

[[example]]
name = "audit_events_tokio_manual_thread_builder"
required-features = ["tokio_socket"]

[[example]]
name = "audit_events_async_std"
required-features = ["smol_socket"]
